services:
  postgres:
    image: postgres:16-alpine
    container_name: duichinese-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-duichinese}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duichinese_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-duichinese_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duichinese} -d ${POSTGRES_DB:-duichinese_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: duichinese-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://duichinese:duichinese_dev_pass@postgres:5432/duichinese_db
      PORT: 8000
      ENVIRONMENT: development
    ports:
      - "8000:8000"

volumes:
  postgres_data:

